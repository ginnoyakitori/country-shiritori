<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>国名しりとりカード</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <!-- =====================
         ゲーム開始画面
    ====================== -->

    <div id="startScreen">

        <div class="start-card">

            <div class="title-icon">
                🌏
            </div>

            <h1 class="title">
                国名しりとりカード
            </h1>

            <p class="description">
                左カードの文字から始めて、
                国名・首都名だけでしりとりをします。
                右カードの文字で終われば正解です。
            </p>

            <h2 class="method-title">
                入力方法を選択
            </h2>

            <!-- フリック入力 -->

            <label class="method-label">

                <input
                    type="radio"
                    name="inputMethod"
                    value="flick"
                    checked>

                <span class="method-content">

                    <span
                        class="method-icon"
                        aria-hidden="true">
                        📱
                    </span>

                    <span class="method-text">

                        <strong>
                            フリック入力
                        </strong>

                        <small>
                            画面のキーボードを使用
                        </small>

                    </span>

                </span>

            </label>

            <!-- ローマ字入力 -->

            <label class="method-label">

                <input
                    type="radio"
                    name="inputMethod"
                    value="romaji">

                <span class="method-content">

                    <span
                        class="method-icon"
                        aria-hidden="true">
                        ⌨️
                    </span>

                    <span class="method-text">

                        <strong>
                            ローマ字入力
                        </strong>

                        <small>
                            PCのキーボードを使用
                        </small>

                    </span>

                </span>

            </label>

            <button
                type="button"
                id="startBtn">
                ゲーム開始
            </button>

            <div
                id="loadError"
                role="alert"
                aria-live="assertive">
            </div>

        </div>

    </div>

    <!-- =====================
         ゲーム画面
    ====================== -->

    <main
        id="gameScreen"
        hidden>

        <!-- ゲーム上部 -->

        <header class="game-header">

            <h1>
                国名しりとりカード
            </h1>

            <div class="game-status">

                <!-- ストップウォッチ -->

                <div
                    id="stopwatch"
                    aria-label="経過時間"
                    role="timer">
                    00:00.00
                </div>

                <!-- 残り問題数 -->

                <div
                    id="remainingCount"
                    aria-live="polite">
                </div>

            </div>

        </header>

        <!-- =====================
             左右のカード
        ====================== -->

        <section
            id="cards"
            aria-label="出題カード">

            <div class="card-area">

                <div class="card-label">
                    はじめ
                </div>

                <div
                    class="card"
                    id="leftCard"
                    aria-label="開始文字">
                    ?
                </div>

            </div>

            <div
                class="arrow"
                aria-hidden="true">
                →
            </div>

            <div class="card-area">

                <div class="card-label">
                    おわり
                </div>

                <div
                    class="card"
                    id="rightCard"
                    aria-label="終了文字">
                    ?
                </div>

            </div>

        </section>

        <!-- 現在の条件 -->

        <div
            id="condition"
            aria-live="polite">
        </div>

        <!-- =====================
             回答欄
        ====================== -->

        <div id="answerArea">

            <label
                for="answer"
                class="answer-label">
                回答
            </label>

            <input
                id="answer"
                type="text"
                placeholder="国名または首都名"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                inputmode="none"
                readonly>

        </div>

        <!-- =====================
             ローマ字入力の説明
        ====================== -->

        <div
            id="keyboardHelp"
            aria-label="キーボード操作">

            <div class="keyboard-help-item">

                <kbd>Enter</kbd>

                <span>
                    決定
                </span>

            </div>

            <div class="keyboard-help-item">

                <kbd>Space</kbd>

                <span>
                    ない
                </span>

            </div>

            <div class="keyboard-help-item">

                <kbd>Backspace</kbd>

                <span>
                    1文字削除
                </span>

            </div>

            <div class="keyboard-help-item">

                <kbd>Esc</kbd>

                <span>
                    全消去
                </span>

            </div>

        </div>

        <!-- =====================
             フリックキーボード
        ====================== -->

        <div
            id="flick-grid"
            aria-label="フリック入力キーボード">

            <!-- 1行目 -->

            <button
                type="button"
                class="flick-btn"
                data-char="ア"
                aria-label="あ行">
                ア
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="カ"
                aria-label="か行">
                カ
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="サ"
                aria-label="さ行">
                サ
            </button>

            <!-- 2行目 -->

            <button
                type="button"
                class="flick-btn"
                data-char="タ"
                aria-label="た行">
                タ
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="ナ"
                aria-label="な行">
                ナ
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="ハ"
                aria-label="は行">
                ハ
            </button>

            <!-- 3行目 -->

            <button
                type="button"
                class="flick-btn"
                data-char="マ"
                aria-label="ま行">
                マ
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="ヤ"
                aria-label="や行">
                ヤ
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="ラ"
                aria-label="ら行">
                ラ
            </button>

            <!-- 4行目 -->

            <button
                type="button"
                id="modifyBtn"
                class="utility-btn"
                aria-label="濁点、半濁点、小文字を切り替える">
                濁・小
            </button>

            <button
                type="button"
                class="flick-btn"
                data-char="ワ"
                aria-label="わ行">
                ワ
            </button>

            <button
                type="button"
                id="deleteBtn"
                class="utility-btn"
                aria-label="最後の文字を削除">
                消
            </button>

        </div>

        <!-- =====================
             フリック入力用ボタン
        ====================== -->

        <div
            id="controlButtons"
            class="buttons">

            <button
                type="button"
                id="checkBtn">
                決定
            </button>

            <button
                type="button"
                id="noneBtn">
                ない
            </button>

        </div>

        <!-- =====================
             判定結果
        ====================== -->

        <div
            id="result"
            role="status"
            aria-live="assertive">
        </div>

    </main>

    <script src="client.js"></script>

</body>

</html>
